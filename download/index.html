<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>널스메이트 다운로드</title>
  <meta name="description" content="휴대폰에 맞는 널스메이트 앱을 다운로드하세요. App Store와 Google Play에서 만나보세요.">
  <link rel="icon" href="../assets/app-icon.png">
  <link rel="stylesheet" href="../landing.css">
  <script src="download.js" defer></script>
</head>
<body class="download-page">
  <main class="download-box">
    <img class="download-icon" src="../assets/app-icon.png" width="68" height="68" alt="널스메이트 앱 아이콘">
    <p class="eyebrow blue">나의 간호 메이트</p>
    <h1>널스메이트 다운로드</h1>
    <p class="download-status" id="download-status" aria-live="polite">사용 중인 기기에 맞는 스토어를 선택해 주세요.<br>iPhone은 App Store, Android는 Google Play에서 다운로드할 수 있어요.</p>
    <div class="store-buttons">
      <a class="button store-button" id="ios-link" href="https://apps.apple.com/kr/app/id6783877557">App Store에서 다운로드 <span aria-hidden="true">↗</span></a>
      <a class="button store-button" id="android-link" href="https://play.google.com/store/apps/details?id=app.nursemate&amp;hl=ko">Google Play에서 다운로드 <span aria-hidden="true">↗</span></a>
    </div>
    <p class="manual-note">자동으로 연결되지 않으면 위 버튼을 눌러 주세요.<br>iOS 앱: iOS 17 이상 · iOS 처치 타이머: iOS 26.1 이상</p>
    <a class="text-link" href="../">널스메이트 알아보기 <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
